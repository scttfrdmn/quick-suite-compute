[project]
name = "campus-compute"
version = "0.18.0"
description = "Ephemeral analytics compute for AgentCore tool planes"
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib>=2.170.0",
    "constructs>=10.0.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "requests>=2.31",
    "ruff>=0.4",
    "boto3>=1.26",
    "pandas>=2.0",
    "pyarrow>=14",
    # profile handler runtime deps (mirror lambdas/runner/Dockerfile)
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "prophet>=1.1",
    "lifelines>=0.27",
    "vaderSentiment>=3.3",
    "ruptures>=1.1",
    "shapely>=2.0",
    "networkx>=3.4",
    "python-louvain>=0.16",
    "xarray>=2024.10",
    "netCDF4>=1.7",
    "pypdf>=5.1",
    "RestrictedPython>=8.0",
    "openpyxl>=3.1",
    "pip-audit>=2.7",
    "cfn-lint>=1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires Substrate running (auto-started from ~/src/substrate)",
    "e2e: requires deployed QuickSuiteCompute stack and AWS credentials",
]

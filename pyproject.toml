[project]
name = "quick-suite-compute"
version = "0.1.0"
description = "Ephemeral analytics compute for Amazon Quick Suite"
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib>=2.170.0",
    "constructs>=10.0.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "requests>=2.31",
    "ruff>=0.4",
    "boto3>=1.26",
    "pandas>=2.0",
    "pyarrow>=14",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires Substrate running (auto-started from ~/src/substrate)",
    "e2e: requires deployed QuickSuiteCompute stack and AWS credentials",
]
